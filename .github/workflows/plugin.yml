name: Plugin

on:
  push:
    branches: [main]
    paths: ['plugin/**', '.github/workflows/plugin.yml']
  pull_request:
    paths: ['plugin/**', '.github/workflows/plugin.yml']
  workflow_dispatch:

jobs:
  build:
    # Windows only: BeyondATC runs only on Windows, so nobody can use a Linux or Mac build of the plugin.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S plugin -B build/plugin -A x64
      - name: Build
        run: cmake --build build/plugin --config Release --parallel
      - name: Test
        run: ctest --test-dir build/plugin -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: clearancelink-plugin-Windows
          path: build/plugin/ClearanceLink
