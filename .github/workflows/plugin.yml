name: Plugin

on:
  push:
    branches: [main]
    paths: ['plugin/**', '.github/workflows/plugin.yml']
  pull_request:
    paths: ['plugin/**', '.github/workflows/plugin.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then cmake -S plugin -B build/plugin -A x64; else cmake -S plugin -B build/plugin -DCMAKE_BUILD_TYPE=Release; fi
      - name: Build
        run: cmake --build build/plugin --config Release --parallel
      - name: Test
        run: ctest --test-dir build/plugin -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: xpconnect-plugin-${{ runner.os }}
          path: build/plugin/XPConnect
