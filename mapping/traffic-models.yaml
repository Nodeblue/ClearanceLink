# BATC traffic model title -> ICAO aircraft type and airline, read by ClearanceLink.Host (TrafficModels).
# The X-Plane plugin (docs/protocol/plugin.md) hands both to XPMP2, which picks the closest CSL model and livery it has.
#
# BATC's titles come from MSFS's model list (mapping/liveries.json), e.g.
#   FSLTL_B738_Qantas, FSLTL_FAIB_A21N_JST-Jetstar Airways, FSLTL_TFS_A332_QFA-Qantas, FSLTL_B738F_ZZZZ,
#   Asobo PassiveAircraft King Air 350i
# FSLTL titles are read as FSLTL_[prefix_]<type>[F]_<airline>: the airline is the 3-letter code before "-" when there
# is one, else the first name below found in the title, else a bare 3-letter code. Everything else uses these lists.

# Words after "FSLTL_" that name a model pack, not a type.
prefixes: [FAIB, TFS, FSPXAI, OSP, FSLTL, SBAI, GA]

# FSLTL type words that are not ICAO type codes. A 5-letter word ending in F (freighter, e.g. B738F) drops the F first.
types:
  C208B: C208
  B73X: B738

# Words that look like airline codes but are not (engine makers, FSLTL's "no airline").
not_airlines: [IAE, CFM, ZZZZ, LIC, NEO, CEO, OC, NC]

# Airline names as they appear in titles (case-insensitive) -> ICAO airline code. Longest match wins.
airlines:
  Qantas: QFA
  QantasLink: QLK
  Virgin Australia: VOZ
  Velocity: VOZ
  Jetstar: JST
  Alliance: UTY
  Rex: RXA
  Air New Zealand: ANZ
  Emirates: UAE
  Singapore: SIA
  Qatar: QTR
