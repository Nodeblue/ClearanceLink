# Pitch (degrees, nose up positive) for parked and slow-taxiing aircraft, by ICAO type. Some CSL models sit with the
# nose wheel off the ground when drawn level; a little nose-down puts it back. Tune per type from screenshots.
# Live tests at YBBN (Bluebell): 2026-10-01 E-Jets at -1.5 with -1 ft sank a little, 737s at -0.75 had a small
# nose-wheel gap. Plugin 0.4.0 and later fit each model to its own wheels and use these only for models they cannot fit
# (docs/protocol/plugin.md); older plugins use them for every model.
ground_pitch:
  default: 0
  E170: -1.0
  E175: -1.0
  E190: -1.0
  E195: -1.0
  B736: -1.0
  B737: -1.0
  B738: -1.0
  B739: -1.0
  B38M: -1.0
  B39M: -1.0

# Feet to raise (+) or lower (-), by ICAO type (plugin 0.2.0 or later). 2026-10-03: a level Bluebell CRJ sat right at 0.
ground_offset_ft:
  default: 0

# Used when nothing above gives a type (XPMP2 then draws its closest model).
default_type: A320
